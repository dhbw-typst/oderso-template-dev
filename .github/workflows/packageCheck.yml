name: Package Check
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package_check:
    name: Check package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "./repo"

      - name: Install typst
        uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5.2.0
        with:
          typst-version: 0.15.1

      - name: Fetch all @preview packages for package-check
        run: |
          typst compile --format pdf repo/template/main-dhbw-ka.typ /dev/null

      - name: Install package locally
        # Install package in preview cache folder
        run: ./scripts/package_template.sh -p
        working-directory: ./repo

      - name: Run package check
        # TARGET_DIR, PKG_NAME, and PKG_VERSION are set in package_template.sh
        run: docker run -v ${{ env.TARGET_DIR }}:/packages/preview ghcr.io/typst/package-check check "@preview/${{ env.PKG_NAME }}:${{ env.PKG_VERSION }}"

  check_typst_init:
    name: Check typst init on package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install typst
        uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5.2.0
        with:
          typst-version: 0.15.1

      - name: Install package locally
        run: ./scripts/package_template.sh

      - name: Install Inter font
        # Required for `main-dhbw-ma.typ`, which uses Inter as a fallback for
        # Arial in `template/template/assets/ai-declaration-form_dhbw-ma.typ`.
        # See https://github.com/rsms/inter/releases/tag/v4.1
        run: |
          curl -sSL https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip -o /tmp/inter.zip
          unzip -q /tmp/inter.zip -d /tmp/inter
          mkdir -p "$HOME/.local/share/fonts/inter"
          find /tmp/inter -type f \( -name "*.ttf" -o -name "*.otf" \) -exec cp {} "$HOME/.local/share/fonts/inter/" \;
          fc-cache -f

      - name: Initialize project
        run: |
          typst init @local/${{ env.PKG_NAME }}:${{ env.PKG_VERSION }}
          cd ${{ env.PKG_NAME }}
          for file in main*.typ; do
            echo "Compile $file"
            typst compile $file
          done
